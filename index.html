<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Vodafone PNG</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
}

.login-container {
    background: white;
    padding: 30px;
    border-radius: 10px;
    width: 320px;
    text-align: center;
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
}

.logo {
    width: 120px;
    margin-bottom: 15px;
}

h2 {
    margin-bottom: 20px;
    color: #e60000;
}

input {
    width: 100%;
    padding: 10px;
    margin: 10px 0;
    border-radius: 5px;
    border: 1px solid #ccc;
}

button {
    width: 100%;
    padding: 12px;
    background: #e60000;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}

button:hover {
    background: #cc0000;
}

.error {
    color: red;
    margin-top: 10px;
}
<style>
body {
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #e60000, #111);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
}

/* GLASS LOGIN BOX */
.login-container {
    width: 340px;
    padding: 35px;
    text-align: center;

    /* Glass effect */
    background: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);

    border-radius: 20px;
    border: 1px solid rgba(255, 255, 255, 0.2);

    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    color: white;
}

.logo {
    width: 110px;
    margin-bottom: 15px;
}

h2 {
    margin-bottom: 20px;
    color: white;
    letter-spacing: 1px;
}

input {
    width: 100%;
    padding: 12px;
    margin: 10px 0;

    border-radius: 10px;
    border: none;
    outline: none;

    background: rgba(255, 255, 255, 0.15);
    color: white;
}

input::placeholder {
    color: rgba(255,255,255,0.7);
}

button {
    width: 100%;
    padding: 12px;

    background: #e60000;
    color: white;
    border: none;
    border-radius: 10px;

    cursor: pointer;
    font-weight: bold;
    transition: 0.3s;
}

button:hover {
    background: #ff1a1a;
    transform: scale(1.03);
}

.error {
    color: #ff8080;
    margin-top: 10px;
}
</style>

</body>
</html>
