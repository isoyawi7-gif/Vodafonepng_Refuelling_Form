<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Vodafone PNG</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
}

.login-container {
    background: white;
    padding: 30px;
    border-radius: 10px;
    width: 320px;
    text-align: center;
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
}

.logo {
    width: 120px;
    margin-bottom: 15px;
}

h2 {
    margin-bottom: 20px;
    color: #e60000;
}

input {
    width: 100%;
    padding: 10px;
    margin: 10px 0;
    border-radius: 5px;
    border: 1px solid #ccc;
}

button {
    width: 100%;
    padding: 12px;
    background: #e60000;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}

button:hover {
    background: #cc0000;
}

.error {
    color: red;
    margin-top: 10px;
}
</style>
</head>

<body>

<div class="login-container">

    <!-- Replace logo.png with your uploaded logo -->
    <img src="logo.png" class="logo" alt="Vodafone Logo">

    <h2>Vodafone PNG</h2>

    <input type="text" id="username" placeholder="Username">
    <input type="password" id="password" placeholder="Password">

    <button onclick="login()">Login</button>

    <div class="error" id="error"></div>

</div>

<script>
function login() {
    const user = document.getElementById("username").value;
    const pass = document.getElementById("password").value;
    const error = document.getElementById("error");

    if (user === "Admin" && pass === "Admin") {
        // Save login state
        localStorage.setItem("loggedIn", "true");

        // Redirect to form page
        window.location.href = "form.html";
    } else {
        error.innerText = "Invalid username or password";
    }
}
</script>

</body>
</html>
