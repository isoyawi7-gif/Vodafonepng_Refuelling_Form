<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vodafone PNG - Refuelling Form</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    margin: 0;
    padding: 20px;
}

#blocked {
    display: none;
    text-align: center;
    margin-top: 100px;
    font-size: 20px;
    color: red;
}

.container {
    max-width: 800px;
    margin: auto;
    background: #fff;
    padding: 25px;
    border-radius: 10px;
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
}

h1 {
    text-align: center;
    color: #e60000;
}

h2 {
    margin-top: 20px;
}

.form-group {
    margin-bottom: 15px;
}

label {
    font-weight: bold;
}

input, textarea, button {
    width: 100%;
    padding: 10px;
    margin-top: 5px;
}

.row {
    display: flex;
    gap: 10px;
    align-items: flex-end;
}

.row .form-group {
    flex: 1;
}

button {
    background: #e60000;
    color: white;
    border: none;
    cursor: pointer;
    border-radius: 5px;
}

button:hover {
    background: #cc0000;
}

.small-btn {
    width: 100%;
    padding: 10px;
    margin-top: 5px;
}

.camera-preview {
    width: 100%;
    margin-top: 10px;
}

img {
    width: 100%;
    margin-top: 10px;
    border-radius: 8px;
    border: 2px solid #ddd;
}
</style>
</head>

<body>

<div id="blocked">
    ❌ Access Denied. Please login first.
</div>

<div class="container" id="app">

<h1>Vodafone PNG</h1>
<h2>Refuelling Form</h2>

<form id="fuelForm">

<input type="hidden" id="loginTime">
<input type="hidden" id="logoutTime">

<div class="row">
    <div class="form-group">
        <label>Team on Site</label>
        <input type="text">
    </div>

    <div class="form-group">
        <label>Date</label>
        <input type="date">
    </div>
</div>

<div class="row">
    <div class="form-group">
        <label>Site Name</label>
        <input type="text">
    </div>

    <div class="form-group">
        <label>Site ID</label>
        <input type="text">
    </div>
</div>

<h2>Fuel Details</h2>

<div class="row">
    <div class="form-group">
        <label>Fuel Before (L)</label>
        <input type="number" id="before">
    </div>

    <div class="form-group">
        <label>📸 Before Photo</label>
        <button type="button" class="small-btn" onclick="openCamera('BEFORE')">Capture</button>
    </div>
</div>

<div class="row">
    <div class="form-group">
        <label>Fuel Top-Up (L)</label>
        <input type="number" id="added">
    </div>

    <div class="form-group">
        <label>📸 Top-Up Photo</label>
        <button type="button" class="small-btn" onclick="openCamera('TOPUP')">Capture</button>
    </div>
</div>

<div class="row">
    <div class="form-group">
        <label>Fuel After (L)</label>
        <input type="number" id="after">
    </div>

    <div class="form-group">
        <label>📸 After Photo</label>
        <button type="button" class="small-btn" onclick="openCamera('AFTER')">Capture</button>
    </div>
</div>

<div class="result" id="calculation"></div>

<h2>Photos</h2>

<video id="video" autoplay playsinline style="width:100%; display:none;"></video>
<canvas id="canvas" style="display:none;"></canvas>

<div>
    <h3>Before Photo</h3>
    <img id="beforeImg">

    <h3>TopUp Photo</h3>
    <img id="topupImg">

    <h3>After Photo</h3>
    <img id="afterImg">
</div>

<p id="gps"></p>

<h2>Driver Details</h2>

<input type="text" placeholder="Driver Name">
<input type="text" placeholder="Vehicle Reg">
<input type="text" placeholder="RTO">

<textarea placeholder="Comments"></textarea>

<button type="submit">Send</button>
<button type="button" onclick="logout()">Logout</button>

</form>

</div>

<script>

/* LOGIN CHECK */
if (localStorage.getItem("loggedIn") !== "true") {
    document.getElementById("app").style.display = "none";
    document.getElementById("blocked").style.display = "block";
}

/* LOGIN TIME */
document.getElementById("loginTime").value = new Date().toISOString();

/* LOGOUT */
function logout() {
    localStorage.removeItem("loggedIn");
    document.getElementById("logoutTime").value = new Date().toISOString();
    window.location.href = "index.html";
}

/* CAMERA */
let stream;
let mode = "";

function openCamera(type) {
    mode = type;

    navigator.mediaDevices.getUserMedia({ video: true })
    .then(function(s) {
        stream = s;

        const video = document.getElementById("video");
        video.srcObject = s;
        video.style.display = "block";

        setTimeout(capturePhoto, 2500);
    })
    .catch(function() {
        alert("Camera not available");
    });
}

    ctx.fillText(label, 20, 60);
    ctx.fillText(now, 20, 90);

    navigator.geolocation.getCurrentPosition(function(pos){
        const gpsText =function capturePhoto() {
    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    // SAFETY CHECK (fixes blank AFTER photo bug)
    if (!video.videoWidth || !video.videoHeight) {
        setTimeout(capturePhoto, 500);
        return;
    }

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    ctx.drawImage(video, 0, 0);

    const now = new Date().toLocaleString();

    let label = "";
    if (mode === "BEFORE") label = "BEFORE REFUELLING";
    if (mode === "TOPUP") label = "REFUELLING IN PROGRESS";
    if (mode === "AFTER") label = "AFTER REFUELLING";

    ctx.fillStyle = "rgba(255,0,0,0.85)";
    ctx.font = "20px Arial";

    ctx.fillText("Vodafone PNG", 20, 30);
    ctx.fillText(label, 20, 60);
    ctx.fillText(now, 20, 90);

    navigator.geolocation.getCurrentPosition(function(pos){
        const gpsText =
            `Lat: ${pos.coords.latitude}, Lon: ${pos.coords.longitude}`;

        ctx.fillText(gpsText, 20, 120);
        document.getElementById("gps").innerText = gpsText;
    });

    // IMPORTANT: convert FIRST before stopping camera
    const imgData = canvas.toDataURL("image/png");

    // SAVE + DISPLAY (FIXED RELIABILITY)
    if (mode === "BEFORE") {
        document.getElementById("beforeImg").src = imgData;
    }

    if (mode === "TOPUP") {
        document.getElementById("topupImg").src = imgData;
    }

    if (mode === "AFTER") {
        document.getElementById("afterImg").src = imgData;
    }

    // stop camera AFTER capture is confirmed
    setTimeout(() => {
        stream.getTracks().forEach(track => track.stop());
        video.style.display = "none";
    }, 200);
}

/* CALCULATION */
function calculate() {
    const b = parseFloat(document.getElementById("before").value) || 0;
    const a = parseFloat(document.getElementById("added").value) || 0;
    const af = parseFloat(document.getElementById("after").value) || 0;

    const expected = b + a;
    const diff = af - expected;

    document.getElementById("calculation").innerHTML =
        `Expected: ${expected} L | Difference: ${diff} L`;
}

document.getElementById("before").addEventListener("input", calculate);
document.getElementById("added").addEventListener("input", calculate);
document.getElementById("after").addEventListener("input", calculate);

/* SUBMIT */
document.getElementById("fuelForm").addEventListener("submit", function(e){
    e.preventDefault();
    alert("Form submitted successfully");
});

</script>

</body>
</html>
