<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vodafone PNG Refuelling System</title>

<style>
body {font-family:Arial;background:#f4f6f8;margin:0;padding:10px;}
.container {max-width:900px;margin:auto;background:white;padding:15px;border-radius:10px;}
h1{text-align:center;color:#e60000;}
.row{display:flex;gap:10px;flex-wrap:wrap;}
.form-group{flex:1;min-width:140px;}
input,select,textarea{width:100%;padding:6px;font-size:13px;margin-top:4px;}
button{background:#e60000;color:white;border:none;padding:8px;border-radius:5px;cursor:pointer;}
img{width:100%;margin-top:10px;border-radius:8px;}
video,canvas{width:100%;display:none;}
.footer{text-align:center;font-size:12px;margin-top:20px;color:gray;}
</style>
</head>

<body>

<div class="container">

<h1>Vodafone PNG Refuelling</h1>

<form id="fuelForm">

<input type="hidden" id="loginTime">
<input type="hidden" id="logoutTime">

<h2>Site Info</h2>

<div class="row">
<div class="form-group">
<label>Field Engineer</label>
<input id="engineer">
</div>
<div class="form-group">
<label>Additional Team</label>
<input id="team">
</div>
</div>

<div class="row">
<div class="form-group">
<label>Date</label>
<input type="date" id="date">
</div>
<div class="form-group">
<label>Time</label>
<input type="time" id="time">
</div>
</div>

<div class="row">
<div class="form-group">
<label>Site Name</label>
<input id="siteName">
</div>
<div class="form-group">
<label>Site ID</label>
<input id="siteId">
</div>
</div>

<div class="row">
<div class="form-group">
<label>Region</label>
<select id="region" onchange="loadProvinces()">
<option value="">Select Region</option>
<option>Momase</option>
<option>Highlands</option>
<option>Southern</option>
<option>Islands</option>
</select>
</div>

<div class="form-group">
<label>Province</label>
<select id="province"></select>
</div>
</div>

<div class="row">
<div class="form-group">
<label>Tower Height</label>
<select id="tower">
<option>23M Monopole</option>
<option>30M RDS</option>
<option>45M RDS</option>
<option>60M RDS</option>
<option>80M SST</option>
<option>100M SST</option>
</select>
</div>
</div>

<h2>Fuel Details</h2>

<div class="row">
<div class="form-group">
<label>Before (L)</label>
<input id="before" type="number">
</div>
<button type="button" onclick="openCamera('BEFORE')">Before Photo</button>
</div>

<div class="row">
<div class="form-group">
<label>TopUp (L)</label>
<input id="topup" type="number">
</div>
<button type="button" onclick="openCamera('TOPUP')">TopUp Photo</button>
</div>

<div class="row">
<div class="form-group">
<label>After (L)</label>
<input id="after" type="number">
</div>
<button type="button" onclick="openCamera('AFTER')">After Photo</button>
</div>

<h2>Camera</h2>

<video id="video" autoplay playsinline></video>
<canvas id="canvas"></canvas>

<h3>Before</h3><img id="imgBefore">
<h3>TopUp</h3><img id="imgTopup">
<h3>After</h3><img id="imgAfter">

<h2>Power</h2>

<select id="genset">
<option>FG Wilson 15KVa</option>
<option>Polar Power</option>
<option>Sengen 15Kva</option>
</select>

<select id="ppl" onchange="togglePPL()">
<option>No PPL</option>
<option>Yes</option>
</select>

<div id="pplFields" style="display:none;">
<input placeholder="Meter Number" id="meter">
<input placeholder="Reading" id="reading">
</div>

<h2>Driver</h2>

<input placeholder="Driver Name">
<input placeholder="Vehicle Reg">
<textarea placeholder="Comments"></textarea>

<button type="submit">Send</button>

</form>

<div class="footer">
Powered by Iso Yawi | System Creator
</div>

</div>

<script>

/* LOGIN TIME */
loginTime.value=new Date().toISOString();

/* PROVINCES */
function loadProvinces(){
let region=region.value;
let list=[];

if(region==="Momase"){
list=["Morobe","Madang","Sepik","Eastern Highlands"];
}

if(region==="Highlands"){
list=["Simbu","Western Highlands","Enga","Jiwaka"];
}

if(region==="Southern"){
list=["NCD","Central","Gulf","Oro"];
}

if(region==="Islands"){
list=["ENB","WNB","Bougainville","Manus"];
}

province.innerHTML="";
list.forEach(p=>{
let opt=document.createElement("option");
opt.text=p;
province.add(opt);
});
}

/* CAMERA */
let stream,mode;

function openCamera(type){

if(!siteName.value || !siteId.value || !engineer.value){
alert("Fill Site + Engineer first");
return;
}

if(type==="BEFORE" && !before.value){
alert("Enter BEFORE fuel first");
return;
}

if(type==="TOPUP" && !topup.value){
alert("Enter TOPUP fuel first");
return;
}

if(type==="AFTER" && !after.value){
alert("Enter AFTER fuel first");
return;
}

mode=type;

navigator.mediaDevices.getUserMedia({
video:{facingMode:"environment"}
})
.then(s=>{
stream=s;
video.srcObject=s;
video.style.display="block";
setTimeout(capture,2000);
});
}

function capture(){

const ctx=canvas.getContext("2d");

canvas.width=video.videoWidth;
canvas.height=video.videoHeight;

ctx.drawImage(video,0,0);

let label={
BEFORE:"BEFORE REFUELLING",
TOPUP:"REFUELLING IN PROGRESS",
AFTER:"AFTER REFUELLING"
}[mode];

let fuel={
BEFORE:before.value,
TOPUP:topup.value,
AFTER:after.value
}[mode];

ctx.fillStyle="red";
ctx.font="18px Arial";

ctx.fillText("Vodafone PNG",20,30);
ctx.fillText(label,20,60);
ctx.fillText("Fuel: "+fuel+"L",20,90);
ctx.fillText(siteName.value+" | "+siteId.value,20,120);
ctx.fillText(region.value+" - "+province.value,20,150);
ctx.fillText(new Date().toLocaleString(),20,180);

let img=canvas.toDataURL("image/png");

if(mode==="BEFORE") imgBefore.src=img;
if(mode==="TOPUP") imgTopup.src=img;
if(mode==="AFTER") imgAfter.src=img;

stream.getTracks().forEach(t=>t.stop());
video.style.display="none";
}

/* PPL */
function togglePPL(){
pplFields.style.display = ppl.value==="Yes" ? "block":"none";
}

/* SUBMIT */
fuelForm.onsubmit=e=>{
e.preventDefault();

if(!imgBefore.src || !imgTopup.src || !imgAfter.src){
alert("Capture all photos first");
return;
}

alert("Sent successfully ✔");
};

</script>

</body>
</html>
