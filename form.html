<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vodafone PNG - Refuelling Form</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    margin: 0;
    padding: 20px;
}

#blocked {
    display: none;
    text-align: center;
    margin-top: 100px;
    font-size: 20px;
    color: red;
}

.container {
    max-width: 850px;
    margin: auto;
    background: #fff;
    padding: 20px;
    border-radius: 10px;
}

h1 { text-align:center; color:#e60000; }
h2 { margin-top:15px; }

.row {
    display:flex;
    gap:10px;
}

.form-group {
    flex:1;
    margin-bottom:10px;
}

label {
    font-size:13px;
    font-weight:bold;
}

input {
    width:100%;
    padding:6px;
    font-size:13px;
}

button {
    background:#e60000;
    color:white;
    border:none;
    padding:8px;
    border-radius:5px;
    cursor:pointer;
}

.small-btn {
    width:100%;
    font-size:12px;
}

img {
    width:100%;
    margin-top:10px;
    border:2px solid #ddd;
    border-radius:8px;
}

video, canvas {
    width:100%;
    display:none;
}

footer {
    text-align:center;
    margin-top:20px;
    font-size:13px;
    color:#555;
}
</style>
</head>

<body>

<div id="blocked">❌ Access Denied. Please login first.</div>

<div class="container" id="app">

<h1>Vodafone PNG</h1>
<h2>Refuelling Form</h2>

<form id="fuelForm">

<input type="hidden" id="loginTime">

<!-- PERSONNEL INFO -->
<div class="row">
    <div class="form-group">
        <label>Field Engineer</label>
        <input type="text" id="engineer">
    </div>
    <div class="form-group">
        <label>Additional Team</label>
        <input type="text" id="team">
    </div>
</div>

<div class="row">
    <div class="form-group">
        <label>Date</label>
        <input type="date" id="date">
    </div>
    <div class="form-group">
        <label>Time</label>
        <input type="text" id="time" readonly>
    </div>
</div>

<!-- SITE -->
<div class="row">
    <div class="form-group">
        <label>Site Name</label>
        <input type="text" id="siteName">
    </div>
    <div class="form-group">
        <label>Site ID</label>
        <input type="text" id="siteID">
    </div>
</div>

<h2>Fuel Details</h2>

<div class="row">
    <div class="form-group">
        <label>Fuel Before (L)</label>
        <input type="number" id="before">
    </div>
    <div class="form-group">
        <button type="button" class="small-btn" onclick="openCamera('BEFORE')">📸 Before</button>
    </div>
</div>

<div class="row">
    <div class="form-group">
        <label>Fuel Top-Up (L)</label>
        <input type="number" id="added">
    </div>
    <div class="form-group">
        <button type="button" class="small-btn" onclick="openCamera('TOPUP')">📸 Top-Up</button>
    </div>
</div>

<div class="row">
    <div class="form-group">
        <label>Fuel After (L)</label>
        <input type="number" id="after">
    </div>
    <div class="form-group">
        <button type="button" class="small-btn" onclick="openCamera('AFTER')">📸 After</button>
    </div>
</div>

<h2>Photos</h2>

<video id="video" autoplay playsinline></video>
<canvas id="canvas"></canvas>

<h3>Before</h3>
<img id="beforeImg">

<h3>Top-Up</h3>
<img id="topupImg">

<h3>After</h3>
<img id="afterImg">

<p id="gps"></p>

<h2>Driver</h2>
<input type="text" placeholder="Driver Name">
<input type="text" placeholder="Vehicle Reg">
<input type="text" placeholder="RTO">
<textarea placeholder="Comments"></textarea>

<button type="submit">Send</button>
<button type="button" onclick="logout()">Logout</button>

</form>

<footer>
Powered by <b>Iso Yawi</b> | System Creator
</footer>

</div>

<script>

/* LOGIN CHECK */
if (localStorage.getItem("loggedIn") !== "true") {
    document.getElementById("app").style.display = "none";
    document.getElementById("blocked").style.display = "block";
}

/* TIME */
document.getElementById("loginTime").value = new Date().toISOString();
document.getElementById("time").value = new Date().toLocaleTimeString();

function logout(){
    localStorage.removeItem("loggedIn");
    window.location.href="index.html";
}

/* CAMERA */
let stream;
let mode="";

function openCamera(type){

    const siteName = document.getElementById("siteName").value;
    const siteID = document.getElementById("siteID").value;

    if(!siteName || !siteID){
        alert("Please enter Site Name and Site ID first!");
        return;
    }

    mode = type;

    navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: "environment" } }
    })
    .then(s=>{
        stream = s;
        const video = document.getElementById("video");
        video.srcObject = s;
        video.style.display="block";
        setTimeout(capture,2500);
    })
    .catch(()=>alert("Camera error"));
}

function capture(){

    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    if(!video.videoWidth){
        setTimeout(capture,500);
        return;
    }

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    ctx.drawImage(video,0,0);

    const now = new Date().toLocaleString();

    const siteName = document.getElementById("siteName").value;
    const siteID = document.getElementById("siteID").value;
    const engineer = document.getElementById("engineer").value;
    const team = document.getElementById("team").value;

    let label = "";
    if(mode==="BEFORE") label="BEFORE REFUELLING";
    if(mode==="TOPUP") label="REFUELLING IN PROGRESS";
    if(mode==="AFTER") label="AFTER REFUELLING";

    ctx.fillStyle="rgba(255,0,0,0.85)";
    ctx.font="16px Arial";

    ctx.fillText("Vodafone PNG",20,30);
    ctx.fillText(label,20,55);
    ctx.fillText(`Site:${siteName} (${siteID})`,20,80);
    ctx.fillText(`Eng:${engineer} Team:${team}`,20,105);
    ctx.fillText(now,20,130);

    navigator.geolocation.getCurrentPosition(pos=>{
        const gps=`Lat:${pos.coords.latitude}, Lon:${pos.coords.longitude}`;
        ctx.fillText(gps,20,155);
        document.getElementById("gps").innerText=gps;
    });

    const img=canvas.toDataURL("image/png");

    if(mode==="BEFORE") document.getElementById("beforeImg").src=img;
    if(mode==="TOPUP") document.getElementById("topupImg").src=img;
    if(mode==="AFTER") document.getElementById("afterImg").src=img;

    stream.getTracks().forEach(t=>t.stop());
    video.style.display="none";
}

/* CALC */
before.oninput=added.oninput=after.oninput=()=>{
    const b=+before.value||0;
    const a=+added.value||0;
    const af=+after.value||0;
    calculation.innerHTML=`Expected:${b+a} L | Diff:${af-(b+a)} L`;
};

</script>

</body>
</html>
