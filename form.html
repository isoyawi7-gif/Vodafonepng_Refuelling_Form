<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vodafone PNG Refuelling System</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    margin: 0;
    padding: 10px;
}

#blocked {
    display: none;
    text-align: center;
    margin-top: 100px;
    font-size: 18px;
    color: red;
}

.container {
    max-width: 900px;
    margin: auto;
    background: white;
    padding: 15px;
    border-radius: 10px;
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
}

h1 {
    text-align: center;
    color: #e60000;
}

h2 {
    margin-top: 20px;
    font-size: 18px;
}

.row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}

.form-group {
    flex: 1;
    min-width: 140px;
}

label {
    font-size: 13px;
    font-weight: bold;
}

input, select, textarea {
    width: 100%;
    padding: 6px;
    font-size: 13px;
    margin-top: 4px;
}

button {
    background: #e60000;
    color: white;
    border: none;
    padding: 8px;
    cursor: pointer;
    border-radius: 5px;
    font-size: 13px;
}

.small-btn {
    width: 100%;
}

img {
    width: 100%;
    margin-top: 10px;
    border-radius: 8px;
}

video {
    width: 100%;
    display: none;
}

.footer {
    text-align: center;
    font-size: 12px;
    margin-top: 20px;
    color: gray;
}
</style>
</head>

<body>

<div id="blocked">❌ Access Denied. Login required.</div>

<div class="container" id="app">

<h1>Vodafone PNG Refuelling</h1>

<form id="fuelForm">

<!-- SESSION -->
<input type="hidden" id="loginTime">
<input type="hidden" id="logoutTime">

<h2>Site Info</h2>

<div class="row">
<div class="form-group">
<label>Field Engineer</label>
<input type="text" id="engineer">
</div>

<div class="form-group">
<label>Additional Team</label>
<input type="text" id="team">
</div>
</div>

<div class="row">
<div class="form-group">
<label>Date</label>
<input type="date" id="date">
</div>

<div class="form-group">
<label>Time</label>
<input type="time" id="time">
</div>
</div>

<div class="row">
<div class="form-group">
<label>Site Name</label>
<input type="text" id="siteName">
</div>

<div class="form-group">
<label>Site ID</label>
<input type="text" id="siteId">
</div>
</div>

<div class="form-group">
<label>Region</label>
<input type="text" id="region">
</div>
</div>

<div class="form-group">
<label>Province</label>
<input type="text" id="province">
</div>
</div>
    
<div class="row">
<div class="form-group">
<label>Tower Height (m)</label>
<select id="tower">
<option>23 Meter Monopole</option>
<option>30M RDS</option>
<option>45 M RDS</option>
<option>45 M Grilliage</option>
<option>45 M SST</option>
<option>60 M RDS</option>
<option>60 M Grilliage</option>
<option>60 M SST</option>
<option>80 M Grilliage</option>
<option>80 M SST </option>
<option>100 M SST</option>
<option>110 M SST</option>
</div>
</div>

<h2>Fuel Details</h2>

<div class="row">
<div class="form-group">
<label>Fuel Before (L)</label>
<input type="number" id="before">
</div>
<div class="form-group">
<button type="button" onclick="openCamera('BEFORE')">Before Photo</button>
</div>
</div>

<div class="row">
<div class="form-group">
<label>Fuel TopUp (L)</label>
<input type="number" id="added">
</div>
<div class="form-group">
<button type="button" onclick="openCamera('TOPUP')">TopUp Photo</button>
</div>
</div>

<div class="row">
<div class="form-group">
<label>Fuel After (L)</label>
<input type="number" id="after">
</div>
<div class="form-group">
<button type="button" onclick="openCamera('AFTER')">After Photo</button>
</div>
</div>

<div id="calc"></div>

<h2>Genset & Power</h2>

<div class="row">
<div class="form-group">
<label>Genset Type</label>
<select id="genset">
<option>Yanhan 8KVA </option>
<option>Yanhan 17Kva</option>
<option>Yanhan 24Kva</option>
<option>CCTC 11KVa</option>
<option>CCTC 17Kva</option>
<option>CCTC 24Kva</option>
<option>FG Wilson 15KVa</option>
<option>Polar Power</option>
<option>Sengen 15Kva</option>
</select>


<div class="row">
<div class="form-group">
<label>PPL Connected?</label>
<select id="ppl" onchange="togglePPL()">
<option value="No">No</option>
<option value="Yes">Yes</option>
</select>
</div>

<div class="form-group" id="pplFields" style="display:none;">
<input placeholder="PPL Meter Number" id="meter">
<input placeholder="PPL Reading" id="reading">
</div>
</div>

<h2>Camera</h2>

<video id="video" autoplay playsinline></video>
<canvas id="canvas"></canvas>

<h3>Before</h3><img id="imgBefore">
<button type="button" onclick="resetPhoto('BEFORE')">Reset</button>

<h3>TopUp</h3><img id="imgTopup">
<button type="button" onclick="resetPhoto('TOPUP')">Reset</button>

<h3>After</h3><img id="imgAfter">
<button type="button" onclick="resetPhoto('AFTER')">Reset</button>

<h2>Driver</h2>

<input placeholder="Driver Name">
<input placeholder="Vehicle Reg">
<textarea placeholder="Comments"></textarea>

<button type="submit">Send</button>
<button type="button" onclick="logout()">Logout</button>

</form>

<div class="footer">
Powered by Iso Yawi | System Creator
</div>

</div>

<script>

/* LOGIN CHECK */
if(localStorage.getItem("loggedIn")!=="true"){
document.getElementById("app").style.display="none";
document.getElementById("blocked").style.display="block";
}

/* TIME */
loginTime.value=new Date().toISOString();

function logout(){
localStorage.removeItem("loggedIn");
logoutTime.value=new Date().toISOString();
window.location.href="index.html";
}

/* PPL */
function togglePPL(){
document.getElementById("pplFields").style.display =
ppl.value==="Yes"?"block":"none";
}

/* CAMERA */
let stream;
let mode="";

function openCamera(type){

if(!siteName.value || !siteId.value ||!engineer.value ){
alert("Please enter Site Name and Site ID first");
return;
}


mode=type;

navigator.mediaDevices.getUserMedia({
video:{facingMode:"environment"}
})
.then(s=>{
stream=s;
video.srcObject=s;
video.style.display="block";
setTimeout(capture,2500);
});
}

function capture(){

const ctx=canvas.getContext("2d");

canvas.width=video.videoWidth;
canvas.height=video.videoHeight;

ctx.drawImage(video,0,0);

let label={
BEFORE:"BEFORE REFUELLING",
TOPUP:"REFUELLING IN PROGRESS",
AFTER:"AFTER REFUELLING"
}[mode];

let now=new Date().toLocaleString();

ctx.fillStyle="red";
ctx.font="18px Arial";

ctx.fillText("Vodafone PNG",20,30);
ctx.fillText(label,20,60);
ctx.fillText(now,20,90);
ctx.fillText(siteName.value+" | "+siteId.value,20,120);

let img=canvas.toDataURL("image/png");

if(mode==="BEFORE")imgBefore.src=img;
if(mode==="TOPUP")imgTopup.src=img;
if(mode==="AFTER")imgAfter.src=img;

stream.getTracks().forEach(t=>t.stop());
video.style.display="none";
}

/* RESET */
function resetPhoto(type){
if(type==="BEFORE")imgBefore.src="";
if(type==="TOPUP")imgTopup.src="";
if(type==="AFTER")imgAfter.src="";
}

/* CALC */
function calc(){
calc.innerHTML="Expected: "+(+before.value+ +added.value)+" L";
}
before.oninput=added.oninput=after.oninput=calc;

/* SUBMIT */
fuelForm.onsubmit=e=>{
e.preventDefault();
alert("Submitted Successfully");
};

</script>

</body>
</html>
