<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vodafone PNG Refuelling System</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    margin: 0;
    padding: 10px;
}

.container {
    max-width: 900px;
    margin: auto;
    background: white;
    padding: 15px;
    border-radius: 10px;
}

h1 { text-align:center; color:#e60000; }

.row {
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.form-group {
    flex:1;
    min-width:140px;
}

input {
    width:100%;
    padding:6px;
    font-size:13px;
}

button {
    background:#e60000;
    color:white;
    border:none;
    padding:8px;
    border-radius:5px;
    cursor:pointer;
}

img {
    width:100%;
    margin-top:10px;
    border-radius:8px;
}

video, canvas { width:100%; display:none; }

.footer {
    text-align:center;
    font-size:12px;
    color:gray;
    margin-top:20px;
}

.alert {
    color:red;
    font-size:13px;
    margin:5px 0;
}
</style>
</head>

<body>

<div class="container">

<h1>Vodafone PNG Refuelling</h1>

<div id="msg" class="alert"></div>

<form id="fuelForm">

<h2>Site Info</h2>

<div class="row">
<div class="form-group">
<input id="siteName" placeholder="Site Name">
</div>

<div class="form-group">
<input id="siteId" placeholder="Site ID">
</div>
</div>

<h2>Fuel Readings</h2>

<div class="row">
<input id="before" placeholder="Before (L)">
<button type="button" onclick="openCamera('BEFORE')">Before Photo</button>
</div>

<div class="row">
<input id="topup" placeholder="TopUp (L)">
<button type="button" onclick="openCamera('TOPUP')">TopUp Photo</button>
</div>

<div class="row">
<input id="after" placeholder="After (L)">
<button type="button" onclick="openCamera('AFTER')">After Photo</button>
</div>

<h2>Camera</h2>

<video id="video" autoplay playsinline></video>
<canvas id="canvas"></canvas>

<h3>Before</h3><img id="imgBefore">
<h3>TopUp</h3><img id="imgTopup">
<h3>After</h3><img id="imgAfter">

<button type="submit">Send</button>

</form>

<div class="footer">
Powered by Iso Yawi | System Creator
</div>

</div>

<script>

let stream;
let mode="";

let beforeCaptured=false;
let topupCaptured=false;
let afterCaptured=false;

function showMsg(text){
document.getElementById("msg").innerText = text;
setTimeout(()=>msg.innerText="",3000);
}

/* VALIDATE BEFORE CAMERA */
function openCamera(type){

if(!siteName.value || !siteId.value){
showMsg("⚠ Please enter Site Name and Site ID first");
return;
}

if(type==="TOPUP" && !beforeCaptured){
showMsg("⚠ Capture BEFORE photo first");
return;
}

if(type==="AFTER" && !topupCaptured){
showMsg("⚠ Capture TOPUP photo first");
return;
}

if(type==="BEFORE" && !before.value){
showMsg("⚠ Enter Before fuel reading first");
return;
}

if(type==="TOPUP" && !topup.value){
showMsg("⚠ Enter TopUp fuel reading first");
return;
}

if(type==="AFTER" && !after.value){
showMsg("⚠ Enter After fuel reading first");
return;
}

mode=type;

navigator.mediaDevices.getUserMedia({
video:{ facingMode:"environment" }
})
.then(s=>{
stream=s;
video.srcObject=s;
video.style.display="block";
setTimeout(capture,2000);
});
}

function capture(){

const ctx=canvas.getContext("2d");

canvas.width=video.videoWidth;
canvas.height=video.videoHeight;

ctx.drawImage(video,0,0);

let label={
BEFORE:"BEFORE REFUELLING",
TOPUP:"REFUELLING IN PROGRESS",
AFTER:"AFTER REFUELLING"
}[mode];

let fuel =
mode==="BEFORE"?before.value:
mode==="TOPUP"?topup.value:
after.value;

ctx.fillStyle="red";
ctx.font="18px Arial";

ctx.fillText("Vodafone PNG",20,30);
ctx.fillText(label,20,60);
ctx.fillText("Fuel: "+fuel+" L",20,90);
ctx.fillText(siteName.value+" | "+siteId.value,20,120);
ctx.fillText(new Date().toLocaleString(),20,150);

let img=canvas.toDataURL("image/png");

if(mode==="BEFORE"){ imgBefore.src=img; beforeCaptured=true; }
if(mode==="TOPUP"){ imgTopup.src=img; topupCaptured=true; }
if(mode==="AFTER"){ imgAfter.src=img; afterCaptured=true; }

stream.getTracks().forEach(t=>t.stop());
video.style.display="none";
}

/* SEND VALIDATION */
fuelForm.onsubmit=e=>{
e.preventDefault();

if(!siteName.value || !siteId.value){
showMsg("⚠ Please fill Site details");
return;
}

if(!beforeCaptured || !topupCaptured || !afterCaptured){
showMsg("⚠ Please capture all photos first");
return;
}

if(!before.value || !topup.value || !after.value){
showMsg("⚠ Please fill all fuel readings first");
return;
}

alert("Sent successfully ✔");
};

</script>

</body>
</html>
