<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Vodafone PNG</title>

<style>
* {
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #e60000, #111);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
}

/* GLASS LOGIN BOX */
.login-container {
    width: 340px;
    padding: 35px;
    text-align: center;

    background: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);

    border-radius: 20px;
    border: 1px solid rgba(255, 255, 255, 0.2);

    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    color: white;
}

.logo {
    width: 110px;
    margin-bottom: 15px;
}

h2 {
    margin-bottom: 10px;
    color: white;
    letter-spacing: 1px;
}

.subtitle {
    margin-bottom: 20px;
    color: rgba(255,255,255,0.8);
    font-size: 14px;
}

input {
    width: 100%;
    padding: 12px;
    margin: 10px 0;

    border-radius: 10px;
    border: none;
    outline: none;

    background: rgba(255, 255, 255, 0.15);
    color: white;
}

input::placeholder {
    color: rgba(255,255,255,0.7);
}

button {
    width: 100%;
    padding: 12px;

    background: #e60000;
    color: white;
    border: none;
    border-radius: 10px;

    cursor: pointer;
    font-weight: bold;
    transition: 0.3s;
    margin-top: 10px;
}

button:hover {
    background: #ff1a1a;
    transform: scale(1.03);
}

.error {
    color: #ff8080;
    margin-top: 10px;
    font-size: 14px;
    min-height: 20px;
}

.system-info {
    margin-top: 20px;
    font-size: 11px;
    color: rgba(255,255,255,0.55);
}
</style>
</head>

<body>

<div class="login-container">

    <!-- Vodafone PNG Logo -->
    <img src="Logo.jpg" class="logo" alt="Vodafone PNG Logo">

    <h2>Vodafone PNG Fuel System</h2>

    <div class="subtitle">
        Enter your system credentials
    </div>

    <input 
        type="text" 
        id="username" 
        placeholder="Username"
        autocomplete="username"
    >

    <input 
        type="password" 
        id="password" 
        placeholder="Password"
        autocomplete="current-password"
    >

    <button onclick="login()">Login</button>

    <div class="error" id="error"></div>

    <div class="system-info">
        Vodafone PNG Fuel & Warehouse Management System
    </div>

</div>

<script>

function login() {

    const user = document.getElementById("username").value.trim();
    const pass = document.getElementById("password").value;
    const error = document.getElementById("error");

    error.innerText = "";

    /*
    ==========================================
    ADMIN LOGIN
    Username: Admin
    Password: Admin
    Page: form.html
    ==========================================
    */

    if (user === "Admin" && pass === "Admin") {

        localStorage.setItem("loggedIn", "true");
        localStorage.setItem("userRole", "Admin");
        localStorage.setItem("username", user);

        window.location.href = "form.html";
        return;
    }


    /*
    ==========================================
    WAREHOUSE LOGIN
    Username: Warehouse
    Password: Warehouse
    Page: Warehousedashboard.html
    ==========================================
    */

    if (user === "Warehouse" && pass === "Warehouse") {

        localStorage.setItem("loggedIn", "true");
        localStorage.setItem("userRole", "Warehouse");
        localStorage.setItem("username", user);

        window.location.href = "Warehousedashboard.html";
        return;
    }


    /*
    ==========================================
    INVALID LOGIN
    ==========================================
    */

    error.innerText = "Invalid username or password";
}

</script>

</body>
</html>
