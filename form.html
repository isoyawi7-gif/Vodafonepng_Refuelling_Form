<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vodafone PNG Refuelling System</title>

<style>
body {
    font-family: Arial;
    background:#f4f6f8;
    margin:0;
    padding:10px;
}

.container {
    max-width:900px;
    margin:auto;
    background:white;
    padding:15px;
    border-radius:10px;
}

h1 {text-align:center;color:#e60000;}

.row {
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.form-group {
    flex:1;
    min-width:140px;
}

label {
    font-size:13px;
    font-weight:bold;
}

input, select, textarea {
    width:100%;
    padding:6px;
    font-size:13px;
    margin-top:4px;
}

button {
    background:#e60000;
    color:white;
    border:none;
    padding:8px;
    border-radius:5px;
    cursor:pointer;
}

img {
    width:100%;
    margin-top:10px;
    border-radius:8px;
}

video {width:100%; display:none;}

.footer {
    text-align:center;
    font-size:12px;
    margin-top:20px;
}
</style>
</head>

<body>

<div class="container">

<h1>Vodafone PNG Refuelling</h1>

<form id="fuelForm">

<!-- SITE INFO -->
<div class="row">
<div class="form-group">
<label>Field Engineer</label>
<input id="engineer">
</div>

<div class="form-group">
<label>Additional Team</label>
<input id="team">
</div>
</div>

<div class="row">
<div class="form-group">
<label>Date</label>
<input type="date" id="date">
</div>

<div class="form-group">
<label>Time</label>
<input type="time" id="time">
</div>
</div>

<div class="row">
<div class="form-group">
<label>Site Name</label>
<input id="siteName">
</div>

<div class="form-group">
<label>Site ID</label>
<input id="siteId">
</div>
</div>

<!-- REGION -->
<div class="row">
<div class="form-group">
<label>Region</label>
<select id="region">
<option>Momase</option>
<option>Highlands</option>
<option>Southern</option>
<option>Islands</option>
</select>
</div>

<div class="form-group">
<label>Province</label>
<select id="province">
<option>Morobe</option>
<option>Eastern Highlands</option>
<option>Simbu</option>
<option>Western Highlands</option>
<option>Enga</option>
<option>Southern Highlands</option>
<option>Madang</option>
</select>
</div>
</div>

<!-- TOWER -->
<div class="form-group">
<label>Tower Height</label>
<select id="tower">
<option>30M RDS</option>
<option>45M RDS</option>
<option>60M RDS</option>
<option>80M SST</option>
<option>100M SST</option>
</select>
</div>

<h2>Fuel</h2>

<div class="row">
<div class="form-group">
<label>Fuel Before</label>
<input type="number" id="before">
</div>
<div class="form-group">
<button type="button" onclick="openCamera('BEFORE')">Before Photo</button>
</div>
</div>

<div class="row">
<div class="form-group">
<label>Fuel TopUp</label>
<input type="number" id="added">
</div>
<div class="form-group">
<button type="button" onclick="openCamera('TOPUP')">TopUp Photo</button>
</div>
</div>

<div class="row">
<div class="form-group">
<label>Fuel After</label>
<input type="number" id="after">
</div>
<div class="form-group">
<button type="button" onclick="openCamera('AFTER')">After Photo</button>
</div>
</div>

<div id="calc"></div>

<!-- PPL SECTION -->
<h2>PPL</h2>

<div class="row">
<div class="form-group">
<label>PPL Connected?</label>
<select id="ppl" onchange="togglePPL()">
<option value="No">No</option>
<option value="Yes">Yes</option>
</select>
</div>

<div class="form-group" id="pplFields" style="display:none;">
<input placeholder="Meter Number" id="meter">
<input placeholder="Reading" id="reading">
</div>
</div>

<!-- GENSET -->
<h2>Genset</h2>
<select id="genset">
<option>FG Wilson 15KVa</option>
<option>Polar Power</option>
<option>Sengen 15Kva</option>
</select>

<!-- CAMERA -->
<video id="video" autoplay playsinline></video>
<canvas id="canvas"></canvas>

<h3>Before</h3>
<img id="imgBefore">
<button type="button" onclick="resetPhoto('BEFORE')">Reset</button>

<h3>TopUp</h3>
<img id="imgTopup">
<button type="button" onclick="resetPhoto('TOPUP')">Reset</button>

<h3>After</h3>
<img id="imgAfter">
<button type="button" onclick="resetPhoto('AFTER')">Reset</button>

<h2>Driver</h2>
<input placeholder="Driver Name">
<input placeholder="Vehicle Reg">
<textarea placeholder="Comments"></textarea>

<button type="submit">Send</button>

</form>

<div class="footer">
Powered by Iso Yawi | System Creator
</div>

</div>

<script>

/* PPL TOGGLE */
function togglePPL(){
document.getElementById("pplFields").style.display =
document.getElementById("ppl").value==="Yes" ? "block" : "none";
}

/* CAMERA */
let stream;
let mode="";

function openCamera(type){

if(!siteName.value || !siteId.value || !engineer.value){
alert("Enter Site Name, Site ID & Engineer first");
return;
}

mode=type;

navigator.mediaDevices.getUserMedia({
video:{facingMode:"environment"}
})
.then(s=>{
stream=s;
video.srcObject=s;
video.style.display="block";
setTimeout(capture,2000);
});
}

function capture(){

canvas.width=video.videoWidth;
canvas.height=video.videoHeight;

const ctx=canvas.getContext("2d");
ctx.drawImage(video,0,0);

let label={
BEFORE:"BEFORE REFUELLING",
TOPUP:"REFUELLING IN PROGRESS",
AFTER:"AFTER REFUELLING"
}[mode];

ctx.fillStyle="red";
ctx.font="18px Arial";

ctx.fillText("Vodafone PNG",20,30);
ctx.fillText(label,20,60);
ctx.fillText(new Date().toLocaleString(),20,90);
ctx.fillText(siteName.value+" | "+siteId.value,20,120);

let img=canvas.toDataURL("image/png");

if(mode==="BEFORE") imgBefore.src=img;
if(mode==="TOPUP") imgTopup.src=img;
if(mode==="AFTER") imgAfter.src=img;

stream.getTracks().forEach(t=>t.stop());
video.style.display="none";
}

/* RESET */
function resetPhoto(type){
if(type==="BEFORE") imgBefore.src="";
if(type==="TOPUP") imgTopup.src="";
if(type==="AFTER") imgAfter.src="";
}

/* CALCULATION */
function calculate(){
let expected=(+before.value||0)+(+added.value||0);
let diff=(+after.value||0)-expected;

calc.innerHTML=`Expected: ${expected} L | Diff: ${diff} L`;
}

before.oninput=added.oninput=after.oninput=calculate;

/* SUBMIT VALIDATION */
fuelForm.onsubmit=e=>{
e.preventDefault();

if(!before.value || !added.value || !after.value ||
!imgBefore.src || !imgTopup.src || !imgAfter.src){
alert("Please fill all fields and capture all photos");
return;
}

alert("Submitted Successfully");
};

</script>

</body>
</html>
